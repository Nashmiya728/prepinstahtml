<!DOCTYPE html>
<html>
<head>
<title> FORMS Using HTML </title>
</head>
<body>
<h1><center>FORM for Students</center> </h1>
<form>
<label for="username"> Username:</label>
<input type="text" name="username" placeholder="Enter username">
<br>
<label for="password"> Password:</label>
<input type="password" name="pwd">
<br>
<label for="address"> Address: </label>
<br>
<textarea name="address" rows="5" cols="50">
Enter your address correctly
</textarea>
<br>
<label for="gender"> Gender: </label>
Male<input type="radio" name=”gender”  checked>
Female<input type="radio" name=”gender” >
<br>
<label for="skills"> Skills: </label>
<input type="checkbox" name="skills" value="HTML">HTML 
<input type="checkbox" name="skills"  value="CSS">CSS
<input type="checkbox" name="skills" value="Java">Java 
<input type="checkbox" name="skills" value="Javascript"> Javascript <br>
<label for="phone number"> Phone Number: </label>
  <input type="numbers" name="phone number">
<label for="Qualification"> Highest Education Qualification: </label>
<select name=”Qualification”>
<option>ECE</option>
<option>CSE</option>
<option>EEE</option>
<option>CIVIL</option>
<option>MECH</option>
</select>
<br>
<label for="LOCATION"> Job location preferences: </label>
<br>
<select name="location" multiple size=”5″>
<option>Pune</option>
<option>Bangalore</option>
<option>Noida</option>
<option>chennai</option>
<option>Ahmedabad</option>
<option>Mumbai</option>
<option>Calcutta</option>
<option>Delhi</option>
</select>
<br><br>
<input type="submit" name="submit" value="Next"> <input type="reset" name="reset" value="Reset">
</form>
</body>
</html>
